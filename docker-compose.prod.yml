version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: webportofolio_db_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: webportofoliov2
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO untuk object storage gambar dsb (Opsional jika pakai S3 dari AWS)
  minio:
    image: minio/minio:latest
    container_name: webportofolio_minio_prod
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Setup bucket MinIO awal
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/${MINIO_BUCKET};
      mc anonymous set download local/${MINIO_BUCKET};
      exit 0;
      "

  app:
    # Menggunakan image hasil dari Github Actions
    image: ghcr.io/dandikurnia/webportofoliov2:latest
    container_name: webportofolio_app_prod
    restart: unless-stopped
    ports:
      - "10.254.200.211:3001:3000"
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD}@postgres:5432/webportofoliov2
      NODE_ENV: production
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      HERMES_API_KEY: ${HERMES_API_KEY}
      HERMES_BASE_URL: ${HERMES_BASE_URL}
      HERMES_MODEL: ${HERMES_MODEL}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    # Akan menjalankan migrate database ke postgres saat container di start
    command: node server.js

  migrate:
    image: ghcr.io/dandikurnia/webportofoliov2:latest
    container_name: webportofolio_migrate_prod
    restart: "no"
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD}@postgres:5432/webportofoliov2
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy"

  seed:
    image: ghcr.io/dandikurnia/webportofoliov2:latest
    container_name: webportofolio_seed_prod
    restart: "no"
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD}@postgres:5432/webportofoliov2
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx prisma db seed"

volumes:
  postgres_data:
  minio_data:
